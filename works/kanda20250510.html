function FadeUp({ children, delay = 0, y = 32, duration = 0.9 }) {

  return (
    <motion.div ref={ref}
      initial={{ opacity: 0, y }}
      animate={inView ? { opacity: 1, y: 0 } : { opacity: 0, y }}
      transition={{ duration, delay, ease: [0.16, 1, 0.3, 1] }}>{children}</motion.div>
  );
}

const pageData = {"title":"神田_店舗改修工事","tag":"STORE","type":"renovation","year":"2025","scale":"改修案件","scope":"LED化 / 照明改修","location":"東京都","duration":"","budget":"","body":"パーティルームを備えた店舗の改修工事です。既存照明のLED化とあわせ、演出照明の改修を担当しました。客席の常時照明と、フロア演出のための照明を別系統で構成しています。\n\n## 施工内容\n\n中央の通路には発光床を設置し、パネルごとに色が変化するよう配線しました。壁面にはRGBのLEDラインを走らせ、天井のグリッドには演出用の照明器具とミラーボールを取り付けています。ボックス席の座面下と背面には間接照明を仕込み、常時点灯させる落ち着いた明るさを確保しました。\n\n壁掛けモニターへの電源と信号線、天井スピーカーへの配線もあわせて施工しています。\n\n## 演出照明の回路構成\n\n演出照明は、消費電力が大きく、調光や調色の制御信号を別に必要とします。客席の一般照明と同じ回路にまとめると、演出を切り替えるたびに客席の明るさが揺らいだり、ノイズの影響を受けたりします。\n\n本件では、一般照明、間接照明、演出照明を系統ごとに分け、制御用の配線を電力線から離して敷設しました。発光床のように人が上を歩く箇所は、配線の保護と結線部の防水処理が欠かせません。点検や更新を見込んで、パネル単位で切り離せる構成としています。\n\n## LED化にあわせた見直し\n\n既存器具をLEDに置き換える際は、器具の重量や発熱が変わるため、取付方法と配線の余長を見直す必要があります。調光を行う場合は、調光器と光源の組み合わせによってちらつきが出ることがあり、実機での点灯確認が欠かせません。本件でも器具を仮設置した状態で調光域を確認し、下限側で不点灯やちらつきが出ないことを確かめてから本設置に移りました。\n\n## 保守を見込んだ構成\n\n演出照明は、一般照明に比べて点灯時間あたりの負荷が大きく、器具の交換頻度も高くなります。発光床のように人が上を歩く箇所は、外部からの衝撃や水分の影響も受けます。\n\n施工時に一体化して納めてしまうと、一部の不具合でも広い範囲を解体する必要が生じます。本件では、パネルや器具の単位で切り離せる構成とし、点検口の位置も交換作業を想定して決めました。\n\n店舗の演出照明は、営業への影響を抑えて短時間で復旧できることが重要です。施工時点で保守のしやすさを織り込んでおくことが、長期的な維持費用に効いてきます。\n\n演出照明をともなう店舗では、完成後に運用しながら明るさや色の調整を求められることがあります。本件でも、引き渡し後の調整を見込み、制御の設定を変更できる形で構成を整えました。","coverImage":"../images/works/kanda20250510-cover.jpg","galleryImages":["../images/works/kanda20250510-gallery-1.jpg","../images/works/kanda20250510-gallery-2.jpg","../images/works/kanda20250510-gallery-3.jpg"],"prev":{"slug":"ikebukuro20240308","title":"池袋_店舗改修工事"},"next":{"slug":"inucafe20240406","title":"大型複合施設いぬカフェ_店舗改修工事"}};

              ))}

          </FadeUp>
        )}

        {/* Prev / Next Navigation */}
        <div className="work-detail__nav">
          {d.prev ? (
            <a href={`${d.prev.slug}.html`} className="work-detail__nav-link work-detail__nav-link--prev">

        <button className="lightbox__close" onClick={() => setLightboxSrc(null)} />

}

function App() {
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    const t = setTimeout(() => setLoading(false), 2200);
    document.body.style.overflow = 'hidden';
    return () => clearTimeout(t);
  }, []);
  useEffect(() => {
    if (!loading) document.body.style.overflow = '';
  }, [loading]);
  return (
    <>
      <AnimatePresence>{loading && <LoadingScreen key="loader" />}</AnimatePresence>
      <Header current="works" />
      <main><WorkDetail /></main>
      <Footer />
    </>
  );
}

createRoot(document.getElementById('root')).render(<App />);

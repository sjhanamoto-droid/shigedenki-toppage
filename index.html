<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式会社シゲ電気 ｜ 10年、20年と、信頼を重ねていけるパートナーへ。</title>
<meta name="description" content="株式会社シゲ電気は、テナント改修・オフィスビルを中心に関東全域で電気工事を請け負う会社です。ゼネコン・工務店様との長いお取引を大切にしています。">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --sage-primary:#7C8A8A;
  --sage-mid:#91AAA7;
  --sage-light:#9EBCBA;
  --sage-darker:#5A6868;
  --sage-pale:#D8E2E0;
  --bg-warm:#FAFAF7;
  --bg-sand:#E8E5DC;
  --bg-cream:#F2EFE8;
  --text-sumi:#2C2C2A;
  --text-gray:#6B6B68;
  --text-light:#999996;
  --accent-brass:#B8893E;
  --font-serif:'Noto Serif JP','Yu Mincho',serif;
  --font-sans:'Noto Sans JP',sans-serif;
  --font-display:'Cormorant Garamond','Garamond',serif;
  --font-mono:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:var(--font-sans);
  color:var(--text-sumi);
  background:var(--bg-warm);
  overflow-x:hidden;
  line-height:1.8;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--sage-light);color:var(--text-sumi)}

/* === Loading Screen === */
.loader{
  position:fixed;inset:0;background:var(--bg-warm);z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
}
.loader__logo{width:180px;height:auto}
.loader__text{
  font-family:var(--font-display);font-weight:300;
  letter-spacing:0.5em;font-size:11px;color:var(--sage-primary);
  margin-top:24px;
}
.loader__line{height:1px;background:var(--sage-primary);margin-top:24px}

/* === Header === */
.header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:24px 48px;display:flex;align-items:center;justify-content:space-between;
  transition:all 0.5s cubic-bezier(0.4,0,0.2,1);
  background:transparent;
}
.header--scrolled{
  background:rgba(250,250,247,0.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:14px 48px;border-bottom:1px solid rgba(0,0,0,0.04);
}
.header__logo img{height:46px;transition:height 0.4s}
.header--scrolled .header__logo img{height:38px}
.header__nav{display:flex;gap:40px;font-family:var(--font-serif);font-weight:400;font-size:13px;letter-spacing:0.08em}
.header__nav a{position:relative;color:var(--text-sumi);padding:6px 0;transition:color 0.3s}
.header__nav a::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:var(--sage-primary);transform:scaleX(0);transform-origin:right;
  transition:transform 0.5s cubic-bezier(0.6,0,0.4,1);
}
.header__nav a:hover::after{transform:scaleX(1);transform-origin:left}
.header__nav a:hover{color:var(--sage-primary)}

/* === Hero === */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden}
.hero__bg{position:absolute;inset:0;z-index:0}
.hero__bg img{
  width:100%;height:100%;object-fit:cover;
  position:absolute;inset:0;
}
.hero__overlay{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(105deg,
    rgba(250,250,247,0.95) 0%,
    rgba(250,250,247,0.75) 35%,
    rgba(250,250,247,0.35) 70%,
    rgba(250,250,247,0.1) 100%);
}
.hero__content{
  position:relative;z-index:2;max-width:1280px;margin:0 auto;
  padding:0 6%;width:100%;
}
.hero__small{
  font-family:var(--font-display);font-weight:300;
  letter-spacing:0.4em;font-size:11px;color:var(--sage-primary);
  margin-bottom:32px;
}
.hero__small::before{
  content:'';display:inline-block;width:36px;height:1px;
  background:var(--sage-primary);vertical-align:middle;margin-right:16px;
}
.hero__copy{
  font-family:var(--font-serif);font-weight:300;
  font-size:clamp(28px,4.8vw,68px);line-height:1.55;
  letter-spacing:0.06em;color:var(--text-sumi);
}
.hero__copy .line{overflow:hidden;display:block;padding-bottom:0.08em}
.hero__copy .line > span{display:inline-block;will-change:transform}
.hero__sub{
  margin-top:40px;font-size:15px;line-height:2.1;
  color:var(--text-gray);max-width:520px;letter-spacing:0.04em;
}
.hero__cta{margin-top:48px;display:flex;gap:32px;align-items:center;flex-wrap:wrap}
.btn-primary{
  background:var(--sage-primary);color:var(--bg-warm);
  padding:18px 40px;font-size:13px;letter-spacing:0.15em;
  position:relative;overflow:hidden;transition:all 0.4s;display:inline-block;
}
.btn-primary::before{
  content:'';position:absolute;inset:0;background:var(--sage-darker);
  transform:scaleX(0);transform-origin:right;
  transition:transform 0.5s cubic-bezier(0.6,0,0.4,1);
}
.btn-primary:hover::before{transform:scaleX(1);transform-origin:left}
.btn-primary span{position:relative;z-index:1}
.btn-primary span::after{content:' →';margin-left:8px;transition:margin-left 0.4s}
.btn-primary:hover span::after{margin-left:12px}
.hero__tel{
  font-family:var(--font-display);font-weight:300;font-size:30px;
  letter-spacing:0.05em;color:var(--text-sumi);
}
.hero__tel small{
  display:block;font-family:var(--font-sans);font-size:11px;
  color:var(--text-gray);letter-spacing:0.15em;font-weight:400;margin-top:2px;
}
.hero__scroll{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  font-family:var(--font-display);font-size:11px;letter-spacing:0.4em;
  color:var(--sage-primary);z-index:3;text-align:center;
}
.hero__scroll::after{
  content:'';display:block;width:1px;height:60px;background:var(--sage-primary);
  margin:14px auto 0;animation:scrollLine 2.2s ease-in-out infinite;
}
@keyframes scrollLine{
  0%{transform:scaleY(0);transform-origin:top}
  50%{transform:scaleY(1);transform-origin:top}
  51%{transform:scaleY(1);transform-origin:bottom}
  100%{transform:scaleY(0);transform-origin:bottom}
}

/* === Section common === */
.section{padding:140px 6%;max-width:1280px;margin:0 auto}
.section__label{
  font-family:var(--font-display);font-weight:400;font-size:12px;
  letter-spacing:0.4em;color:var(--sage-primary);
  margin-bottom:1.2rem;text-transform:uppercase;
}
.section__label::before{
  content:'';display:inline-block;width:32px;height:1px;
  background:var(--sage-primary);vertical-align:middle;margin-right:14px;
}
.section__title{
  font-family:var(--font-serif);font-weight:300;
  font-size:clamp(28px,3.6vw,48px);line-height:1.5;letter-spacing:0.06em;
  margin-bottom:5rem;color:var(--text-sumi);
}

/* === Stats === */
.stats-section{background:var(--bg-warm);position:relative;overflow:hidden}
.stats__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:80px 60px}
.stat{position:relative;padding-top:32px}
.stat::before{
  content:'';position:absolute;top:0;left:0;width:48px;height:1px;
  background:var(--sage-primary);
}
.stat__num{
  font-family:var(--font-display);font-weight:300;
  font-size:clamp(64px,7.5vw,108px);color:var(--sage-primary);
  line-height:0.95;letter-spacing:-0.02em;white-space:nowrap;
}
.stat__num small{font-size:0.42em;margin-left:0.08em;color:var(--sage-mid);font-weight:300}
.stat__label{margin-top:16px;font-size:13px;letter-spacing:0.1em;color:var(--text-gray)}
@media(min-width:1025px){.stat__num--text{font-size:clamp(48px,5vw,72px)}}

/* === Reasons === */
.reasons{background:var(--bg-sand);position:relative}
.reasons__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:60px}
.reason{padding-right:30px}
.reason__num{
  font-family:var(--font-display);font-size:84px;font-weight:300;
  color:var(--sage-mid);line-height:1;opacity:0.55;letter-spacing:-0.02em;
}
.reason__title{
  font-family:var(--font-serif);font-weight:400;font-size:22px;
  margin:1.5rem 0 1.2rem;line-height:1.7;letter-spacing:0.04em;color:var(--text-sumi);
}
.reason__body{font-size:14px;line-height:2;color:var(--text-gray);letter-spacing:0.02em}
.reason__tags{margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:8px}
.reason__tag{
  font-family:var(--font-display);font-size:11px;letter-spacing:0.15em;
  padding:6px 14px;border:1px solid var(--sage-mid);color:var(--sage-darker);
  border-radius:0;
}

/* === Services === */
.services{background:var(--bg-warm)}
.services__grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--sage-light);border-left:1px solid var(--sage-light);
}
.service{
  border-right:1px solid var(--sage-light);border-bottom:1px solid var(--sage-light);
  padding:48px 36px 36px;transition:all 0.5s;cursor:default;position:relative;overflow:hidden;
  background:var(--bg-warm);
}
.service::before{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--sage-primary);transform:scaleX(0);transform-origin:left;
  transition:transform 0.6s cubic-bezier(0.6,0,0.4,1);
}
.service:hover::before{transform:scaleX(1)}
.service:hover{background:var(--bg-cream)}
.service__icon{height:56px;display:flex;align-items:center}
.service__icon img{width:auto;height:48px;transition:transform 0.6s cubic-bezier(0.6,0,0.4,1)}
.service:hover .service__icon img{transform:scale(1.1) rotate(-4deg)}
.service__title{
  font-family:var(--font-serif);font-weight:500;font-size:17px;
  margin:24px 0 12px;letter-spacing:0.04em;color:var(--text-sumi);
}
.service__body{font-size:12px;color:var(--text-gray);line-height:1.85;letter-spacing:0.02em}

/* === Works === */
.works{background:var(--bg-warm)}
.works__featured{
  display:grid;grid-template-columns:1.3fr 1fr;gap:80px;
  align-items:center;margin-bottom:100px;
}
.works__photo{position:relative;aspect-ratio:4/3;overflow:hidden}
.works__photo img{
  width:100%;height:100%;object-fit:cover;
  transition:transform 1.2s cubic-bezier(0.4,0,0.2,1);
}
.works__photo:hover img{transform:scale(1.06)}
.works__photo__tag{
  position:absolute;top:24px;left:24px;background:var(--bg-warm);
  color:var(--sage-primary);font-family:var(--font-display);font-size:11px;
  letter-spacing:0.3em;padding:8px 18px;z-index:1;
}
.works__details{padding-left:0}
.works__details__heading{
  font-family:var(--font-serif);font-weight:300;font-size:30px;
  line-height:1.6;letter-spacing:0.05em;margin-bottom:40px;
}
.works__details dl{display:grid;grid-template-columns:120px 1fr;gap:20px 30px;margin-top:24px}
.works__details dt{
  font-family:var(--font-display);font-size:11px;letter-spacing:0.25em;
  color:var(--sage-primary);text-transform:uppercase;
  padding-top:6px;
}
.works__details dd{
  font-family:var(--font-serif);font-size:15px;line-height:1.8;
  border-bottom:1px solid var(--bg-sand);padding-bottom:14px;color:var(--text-sumi);
}
.works__gallery{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px;
}
.works__gallery__item{
  aspect-ratio:1/1;overflow:hidden;cursor:pointer;position:relative;
}
.works__gallery__item img{
  width:100%;height:100%;object-fit:cover;
  transition:all 0.7s cubic-bezier(0.4,0,0.2,1);filter:brightness(0.96);
}
.works__gallery__item:hover img{transform:scale(1.1);filter:brightness(1.05)}
.works__gallery__item::after{
  content:'';position:absolute;inset:0;background:rgba(124,138,138,0);
  transition:background 0.5s;pointer-events:none;
}
.works__gallery__item:hover::after{background:rgba(124,138,138,0.08)}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);opacity:0;pointer-events:none;transition:opacity 0.3s ease;cursor:zoom-out}
.lightbox--open{opacity:1;pointer-events:auto}
.lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:4px;transform:scale(0.92);transition:transform 0.3s ease}
.lightbox--open img{transform:scale(1)}
.lightbox__close{position:absolute;top:24px;right:24px;width:40px;height:40px;border:none;background:rgba(255,255,255,0.15);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s}
.lightbox__close:hover{background:rgba(255,255,255,0.3)}
.lightbox__close::before,.lightbox__close::after{content:'';position:absolute;width:20px;height:2px;background:#fff}
.lightbox__close::before{transform:rotate(45deg)}
.lightbox__close::after{transform:rotate(-45deg)}

.clients{
  margin-top:80px;padding-top:48px;border-top:1px solid var(--sage-light);
}
.clients__label{
  font-family:var(--font-display);font-size:11px;letter-spacing:0.3em;
  color:var(--sage-primary);margin-bottom:24px;text-transform:uppercase;
}
.clients__list{display:flex;gap:48px;flex-wrap:wrap;font-family:var(--font-serif)}
.client{display:flex;align-items:baseline;gap:12px}
.client__name{font-size:18px;color:var(--text-sumi);letter-spacing:0.05em}
.client__years{font-family:var(--font-display);font-size:15px;color:var(--sage-primary);letter-spacing:0.05em}
.client__years::before{content:'─ ';color:var(--sage-mid)}

/* === Trust === */
.trust{background:var(--bg-sand)}
.trust__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:48px}
.trust__block{padding:0}
.trust__block h3{
  font-family:var(--font-serif);font-weight:500;font-size:18px;
  padding-bottom:18px;border-bottom:1px solid var(--sage-mid);
  margin-bottom:24px;letter-spacing:0.05em;color:var(--text-sumi);
}
.trust__block ul{list-style:none;font-size:13px;line-height:2.1;color:var(--text-gray)}
.trust__block ul li{padding-left:14px;position:relative;letter-spacing:0.02em}
.trust__block ul li::before{
  content:'';position:absolute;left:0;top:14px;width:6px;height:1px;
  background:var(--sage-primary);
}

/* === CEO === */
.ceo-section{background:var(--bg-warm);padding:0;max-width:none;margin:0}
.ceo__inner{display:grid;grid-template-columns:1fr 1.2fr;min-height:680px}
.ceo__photo{position:relative;overflow:hidden;background:var(--sage-pale)}
.ceo__photo img{width:100%;height:100%;object-fit:cover}
.ceo__photo__label{
  position:absolute;bottom:32px;left:32px;color:var(--bg-warm);
  font-family:var(--font-display);font-size:11px;letter-spacing:0.3em;
  z-index:1;background:rgba(44,44,42,0.7);padding:10px 18px;
}
.ceo__text{padding:120px 80px;display:flex;flex-direction:column;justify-content:center}
.ceo__quote{
  font-family:var(--font-serif);font-weight:300;font-size:30px;
  line-height:1.8;letter-spacing:0.05em;margin-bottom:2.5rem;color:var(--text-sumi);
}
.ceo__body{font-size:14px;line-height:2;color:var(--text-gray);max-width:520px;letter-spacing:0.04em}
.ceo__body p+p{margin-top:1.4rem}
.ceo__name{
  margin-top:3.5rem;font-family:var(--font-serif);font-size:13px;
  color:var(--text-gray);letter-spacing:0.05em;
}
.ceo__name strong{
  display:block;font-size:24px;font-weight:400;margin-top:6px;color:var(--text-sumi);
}

/* === Recruit === */
.recruit{
  background:var(--sage-primary);color:var(--bg-warm);
  padding:100px 6%;max-width:none;margin:0;position:relative;overflow:hidden;
}
.recruit::before{
  content:'';position:absolute;top:-50%;right:-20%;width:600px;height:600px;
  border:1px solid rgba(250,250,247,0.1);border-radius:50%;
}
.recruit::after{
  content:'';position:absolute;bottom:-30%;left:-10%;width:400px;height:400px;
  border:1px solid rgba(250,250,247,0.08);border-radius:50%;
}
.recruit__inner{
  max-width:1200px;margin:0 auto;display:grid;
  grid-template-columns:2fr 1fr;align-items:center;gap:80px;
  position:relative;z-index:1;
}
.recruit__label{
  font-family:var(--font-display);font-size:12px;letter-spacing:0.4em;
  margin-bottom:1.2rem;opacity:0.85;text-transform:uppercase;
}
.recruit__title{
  font-family:var(--font-serif);font-weight:300;font-size:36px;
  line-height:1.7;letter-spacing:0.05em;
}
.recruit__body{margin-top:1.5rem;font-size:13px;line-height:2;opacity:0.85}
.btn-outline{
  border:1px solid var(--bg-warm);color:var(--bg-warm);
  padding:18px 40px;font-size:13px;letter-spacing:0.15em;
  transition:all 0.4s;display:inline-block;position:relative;overflow:hidden;
}
.btn-outline::before{
  content:'';position:absolute;inset:0;background:var(--bg-warm);
  transform:scaleY(0);transform-origin:bottom;
  transition:transform 0.5s cubic-bezier(0.6,0,0.4,1);
}
.btn-outline:hover::before{transform:scaleY(1);transform-origin:top}
.btn-outline:hover{color:var(--sage-primary)}
.btn-outline span{position:relative;z-index:1}

/* === Contact === */
.contact{background:var(--bg-warm);padding:140px 6%;max-width:none;margin:0}
.contact__inner{max-width:1280px;margin:0 auto}
.contact__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:5rem}
.contact__card{
  padding:48px 40px;background:var(--bg-warm);border:1px solid var(--sage-light);
  transition:all 0.5s;position:relative;overflow:hidden;
}
.contact__card::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:3px;
  background:var(--sage-primary);transform:scaleX(0);transform-origin:left;
  transition:transform 0.6s cubic-bezier(0.6,0,0.4,1);
}
.contact__card:hover::before{transform:scaleX(1)}
.contact__card:hover{background:var(--bg-cream);border-color:var(--sage-primary)}
.contact__card h3{
  font-family:var(--font-display);font-size:11px;letter-spacing:0.3em;
  color:var(--sage-primary);margin-bottom:1.5rem;text-transform:uppercase;
}
.contact__tel{
  font-family:var(--font-display);font-weight:300;font-size:42px;
  letter-spacing:0.04em;color:var(--text-sumi);margin-bottom:12px;line-height:1;
}
.contact__hours{font-size:12px;color:var(--text-gray);letter-spacing:0.05em}
.contact__items{margin-top:8px}
.contact__items li{
  font-size:13px;color:var(--text-gray);padding:8px 0;
  border-bottom:1px solid var(--bg-sand);list-style:none;
}
.contact__items li:last-child{border:none}
.contact__items li strong{
  display:block;color:var(--text-sumi);font-size:14px;
  font-family:var(--font-serif);font-weight:500;margin-bottom:2px;
}

/* === Footer === */
.footer{background:var(--text-sumi);color:var(--bg-warm);padding:80px 6% 40px}
.footer__inner{
  max-width:1280px;margin:0 auto;display:grid;
  grid-template-columns:1fr auto;gap:80px;
  padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,0.1);
}
.footer__logo img{width:220px;filter:brightness(0) invert(1) opacity(0.85)}
.footer__address{
  margin-top:2rem;font-size:13px;line-height:2;
  opacity:0.7;letter-spacing:0.04em;
}
.footer__tel{
  margin-top:1.5rem;font-family:var(--font-display);font-size:24px;
  font-weight:300;letter-spacing:0.05em;color:var(--bg-warm);
}
.footer__nav{
  display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
  font-family:var(--font-serif);font-size:13px;letter-spacing:0.05em;
  align-content:start;
}
.footer__nav a{opacity:0.75;transition:opacity 0.3s,padding-left 0.3s;display:inline-block}
.footer__nav a:hover{opacity:1;padding-left:6px}
.footer__copyright{
  margin-top:36px;text-align:center;font-size:11px;
  opacity:0.5;letter-spacing:0.15em;font-family:var(--font-display);
}

/* === Responsive === */
@media (max-width:1024px){
  .stats__grid,.reasons__grid,.trust__grid{grid-template-columns:repeat(2,1fr)}
  .services__grid{grid-template-columns:repeat(2,1fr)}
  .works__featured{grid-template-columns:1fr;gap:40px}
  .works__details__heading{font-size:24px}

/* ================= CountUp ================= */
function CountUp({ to, duration = 2 }) {
  const [count, setCount] = useState(0);
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: '-50px' });
  useEffect(() => {
    if (!inView) return;
    let start = null;
    const step = ts => {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / (duration * 1000), 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setCount(Math.round(to * eased));
      if (progress < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [inView, to, duration]);
  return <span ref={ref}>{count}</span>;
}

/* ================= App ================= */
function App() {
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    const t = setTimeout(() => setLoading(false), 2600);
    document.body.style.overflow = 'hidden';
    return () => clearTimeout(t);
  }, []);
  useEffect(() => {
    if (!loading) document.body.style.overflow = '';
  }, [loading]);
  return (
    <>
      <AnimatePresence>
        {loading && <LoadingScreen key="loader" />}
      </AnimatePresence>
      <Header />
      <main>
        <Hero />
        <Stats />
        <Reasons />
        <Services />
        <Works />
        <Trust />
        <CeoMessage />
        <Recruit />
        <Contact />
      </main>
      <Footer />
    </>
  );
}

createRoot(document.getElementById('root')).render(<App />);

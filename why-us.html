function LoadingScreen() {

        initial={{ width: 0 }}

function FadeUp({ children, delay = 0, y = 32, duration = 0.9 }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: '-80px' });
  return (
    <motion.div ref={ref}
      initial={{ opacity: 0, y }}
      animate={inView ? { opacity: 1, y: 0 } : { opacity: 0, y }}
      transition={{ duration, delay, ease: [0.16, 1, 0.3, 1] }}>{children}</motion.div>
  );
}

function CountUp({ to, duration = 2 }) {
  const [count, setCount] = useState(0);
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: '-50px' });
  useEffect(() => {
    if (!inView) return;
    let start = null;
    const step = ts => {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / (duration * 1000), 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setCount(Math.round(to * eased));
      if (progress < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [inView, to, duration]);
  return <span ref={ref}>{count}</span>;
}

function PageHero({ image, label, title, sub, breadcrumb }) {

            animate={{ scale: 1.02, opacity: 1 }}

        <div className="page-hero__content">

            animate={{ opacity: 1, x: 0 }}
            transition={{ delay: 0.4, duration: 0.9 }}>{label}</motion.div>
          <motion.h1 className="page-hero__title"
            initial={{ opacity: 0, y: 24 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ delay: 0.6, duration: 1.1, ease: [0.16, 1, 0.3, 1] }}

            initial={{ opacity: 0, y: 16 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ delay: 0.85, duration: 1.0 }}>{sub}</motion.p>}

        <a href="index.html">HOME</a>

    </>
  );
}

        </FadeUp>
        <FadeUp delay={0.15}>

            テナント改修やオフィスビルの電気工事を中心に、<br />

        <FadeUp delay={0.25}>

        </FadeUp>

      <section className="section reasons">
        <FadeUp><div className="section__label">Three reasons</div></FadeUp>

              tags: ['総合電気', '弱電', '防災', '低圧工事']

      <section className="section">
        <FadeUp><div className="section__label">Long-term partners</div></FadeUp>

          <div className="clients" style={{ marginTop: 0, paddingTop: 0, borderTop: 'none' }}>

      </section>

      <BottomCTA title="まずは、お気軽に<br />ご相談ください。" />
    </>
  );
}

function App() {
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    const t = setTimeout(() => setLoading(false), 2200);
    document.body.style.overflow = 'hidden';
    return () => clearTimeout(t);
  }, []);
  useEffect(() => {
    if (!loading) document.body.style.overflow = '';
  }, [loading]);
  return (
    <>
      <AnimatePresence>{loading && <LoadingScreen key="loader" />}</AnimatePresence>
      <Header current="why" />
      <main><WhyUsPage /></main>
      <Footer />
    </>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>
